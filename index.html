<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Runeterra Roulette Pro</title>
    <!-- 이미지 저장을 위한 라이브러리 -->
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        :root {
            --gold: #c89b3c;
            --dark-bg: #0a0a0c;
            --card-bg: #1e2328;
            --text-white: #f0f0f0;
            --lock-color: #ff4d4d;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--text-white);
            font-family: 'Nanum Gothic', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        .container { width: 100%; max-width: 950px; }

        /* 설정 영역 */
        .settings {
            background: var(--card-bg);
            padding: 25px;
            border: 1px solid #3c3c41;
            border-radius: 8px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .input-group { display: flex; gap: 20px; margin-bottom: 25px; }
        .input-group input {
            flex: 1;
            background: #101215;
            border: 1px solid var(--gold);
            color: white;
            padding: 12px;
            border-radius: 4px;
            outline: none;
        }

        .region-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 12px;
        }
        .region-grid label {
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 5px;
            transition: color 0.2s;
        }
        .region-grid label:hover { color: var(--gold); }

        .controls { text-align: center; margin-bottom: 30px; display: flex; justify-content: center; gap: 15px; }
        button {
            padding: 15px 40px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            border-radius: 4px;
            border: none;
        }
        .btn-roll { background: var(--gold); color: black; }
        .btn-roll:hover { background: #e1b34d; transform: translateY(-3px); box-shadow: 0 5px 15px rgba(200, 155, 60, 0.4); }
        .btn-save { background: #28a745; color: white; }
        .btn-save:hover { background: #218838; transform: translateY(-3px); }
        button:disabled { background: #444; color: #888; transform: none !important; cursor: not-allowed; }

        /* 캡처 영역 */
        #capture-area {
            padding: 30px;
            background: var(--dark-bg);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .result-container {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            width: 100%;
        }

        .card-wrapper { display: flex; flex-direction: column; align-items: center; gap: 15px; }

        .result-card {
            width: 400px;
            height: 220px;
            background: #000;
            position: relative;
            overflow: hidden;
            border: 1px solid #3c3c41;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
        }

        .card-img { width: 100%; height: 100%; object-fit: cover; transition: filter 0.1s; }
        .spinning { filter: blur(5px) brightness(1.2); }

        .lock-control {
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            padding: 8px 15px;
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            transition: background 0.3s;
        }
        .lock-control input:checked + span { color: var(--lock-color); font-weight: bold; }
        .lock-control:hover { background: rgba(255,255,255,0.1); }

        .champion-section {
            margin-top: 40px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            width: 100%;
        }
        .champ-list { 
            list-style: none; padding: 0; 
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; 
        }
        .champ-list li {
            background: #1e2328; padding: 10px;
            text-align: center; border: 1px solid #3c3c41; 
            font-size: 0.9rem; color: #a0a0a0;
        }
        .team-display-name { color: var(--gold); font-size: 1.4rem; margin-bottom: 15px; font-weight: bold; letter-spacing: 1px; }
    </style>
</head>
<body>

<div class="container">
    <div class="settings">
        <div class="input-group">
            <input type="text" id="team1Input" placeholder="1팀 이름">
            <input type="text" id="team2Input" placeholder="2팀 이름">
        </div>
        <h3 style="margin-top: 0; color: var(--gold);">제외할 지역 선택</h3>
        <div id="regionGrid" class="region-grid"></div>
    </div>

    <div class="controls">
        <button onclick="startRoulette()" id="spinBtn" class="btn-roll">룰렛 돌리기</button>
        <button onclick="saveAsImage()" class="btn-save">결과 이미지 저장</button>
    </div>

    <div id="capture-area">
        <div class="result-container">
            <!-- 1팀 결과 -->
            <div class="card-wrapper">
                <div id="team1Label" class="team-display-name">1팀</div>
                <div id="card1" class="result-card">
                    <img id="img1" class="card-img" src="placeholder.png">
                </div>
                <label class="lock-control">
                    <input type="checkbox" id="lock1"> <span>결과 고정 (Lock)</span>
                </label>
            </div>

            <!-- 2팀 결과 -->
            <div class="card-wrapper">
                <div id="team2Label" class="team-display-name">2팀</div>
                <div id="card2" class="result-card">
                    <img id="img2" class="card-img" src="placeholder.png">
                </div>
                <label class="lock-control">
                    <input type="checkbox" id="lock2"> <span>결과 고정 (Lock)</span>
                </label>
            </div>
        </div>

        <div class="champion-section">
            <div id="team1Champs"></div>
            <div id="team2Champs"></div>
        </div>
    </div>
</div>

<script>
    // 지역 데이터: 이미지 파일 이름은 사용자님이 보내주신 순서대로 매칭했습니다.
    const regions = {
        "공허": { img: "void.png", champs: ["벨베스", "초가스", "카이사", "카사딘", "카직스", "코그모", "말자하", "렉사이", "벨코즈"] },
        "그림자군도": { img: "shadowisles.png", champs: ["엘리스", "그웬", "헤카림", "칼리스타", "카서스", "마오카이", "쓰레쉬", "벡스", "비에고", "요릭"] },
        "녹서스": { img: "noxus.png", champs: ["암베사", "브라이어", "카시오페아", "다리우스", "드레이븐","카타리나","클레드","르블랑", "멜", "모데카이저","렐","리븐","사미라","사이온","스웨인","탈론", "블라디미르"] },
        "데마시아": { img: "demacia.png", champs: ["피오라", "갈리오","가렌","자르반 4세", "케일","루시안","럭스","모르가나", "뽀삐","퀸", "쉬바나", "소니", "사일러스", "베인", "신 짜오"] },
        "필트오버": { img: "piltover.png", champs: ["케이틀린","카밀","이즈리얼","하이머딩거","제이스","오리아나","세라핀","바이"] },
        "자운": { img: "zaun.png", champs: ["블리츠크랭크", "문도 박사", "에코", "잔나", "징크스", "레나타 글라스크", "신지드", "트위치" , "우르곳", "빅토르", "워윅" ,"자크","직스","제리"] },
        "아이오니아": { img: "ionia.png", champs: ["아리", "아칼리", "흐웨이", "이렐리아", "아이번", "진", "카르마", "케인", "케넨", "리신", "릴리아", "마스터 이", "라칸", "세트" ,"쉔", "신드라", "바루스","오공", "자야", "야스오", "요네","유나라","제드"] },
        "슈리마": { img: "shurima.png", champs: ["아크샨", "아무무", "아지르", "크산테", "나피리", "나서스", "람머스", "레넥톤","시비르" ,"탈리야", "제라스"] },
        "프렐요드": { img: "freljord.png", champs: ["애니비아","애쉬","오로라","브라움","나르","그라가스","리산드라","누누와 윌럼프","올라프","오른","세주아니","트런들", "트린다미어","우디르","볼리베어"] },
        "타곤": { img: "targon.png", champs: ["아펠리오스", "아우렐리온 솔", "다이애나", "레오나", "판테온", "소라카", "타릭", "조이"] },
        "빌지워터": { img: "bilgewater.png", champs: ["피즈", "갱플랭크","그레이브즈","일라오이","미스 포츈","노틸러스", "파이크", "탐켄치","트위스티드 페이트"] },
        "이쉬탈": { img: "ixtal.png", champs: ["말파이트", "밀리오","니코","니달리","키아나","렝가","스카너","자이라"] },
        "밴들시티": { img: "bandle.png", champs: ["코르키", "룰루", "노라", "럼블", "티모" , "트리스타나", "베이가", "유미"] }
    };

    let currentSelection = { team1: "아이오니아", team2: "데마시아" }; // 초기값
    const regionNames = Object.keys(regions);

    // 체크박스 생성
    const grid = document.getElementById('regionGrid');
    regionNames.forEach(name => {
        const label = document.createElement('label');
        label.innerHTML = `<input type="checkbox" class="exclude-check" value="${name}"> ${name}`;
        grid.appendChild(label);
    });

    // 초기 이미지 로드
    window.onload = () => {
        updateImage('img1', currentSelection.team1);
        updateImage('img2', currentSelection.team2);
    };

    function startRoulette() {
        const isLocked1 = document.getElementById('lock1').checked;
        const isLocked2 = document.getElementById('lock2').checked;
        
        if (isLocked1 && isLocked2) {
            alert("두 지역이 모두 고정되어 있습니다.");
            return;
        }

        // 팀명 업데이트
        document.getElementById('team1Label').innerText = document.getElementById('team1Input').value || "1팀";
        document.getElementById('team2Label').innerText = document.getElementById('team2Input').value || "2팀";

        const excluded = Array.from(document.querySelectorAll('.exclude-check:checked')).map(i => i.value);
        
        // 고정된 지역 중복 방지 포함
        let fixedList = [];
        if (isLocked1) fixedList.push(currentSelection.team1);
        if (isLocked2) fixedList.push(currentSelection.team2);

        let available = regionNames.filter(n => !excluded.includes(n) && !fixedList.includes(n));

        // 지피티가 제안한 안정성 로직 반영
        const neededCount = (isLocked1 ? 0 : 1) + (isLocked2 ? 0 : 1);
        if (available.length < neededCount) {
            alert(`선택 가능한 지역이 부족합니다.\n(필요: ${neededCount}개 / 가능: ${available.length}개)`);
            return;
        }

        const spinBtn = document.getElementById('spinBtn');
        spinBtn.disabled = true;
        
        if (!isLocked1) document.getElementById('img1').classList.add('spinning');
        if (!isLocked2) document.getElementById('img2').classList.add('spinning');

        let startTime = Date.now();
        const interval = setInterval(() => {
            if (!isLocked1) updateImage('img1', regionNames[Math.floor(Math.random() * regionNames.length)]);
            if (!isLocked2) updateImage('img2', regionNames[Math.floor(Math.random() * regionNames.length)]);

            if (Date.now() - startTime > 1800) { // 1.8초간 회전
                clearInterval(interval);
                finalize(available, isLocked1, isLocked2);
            }
        }, 60);
    }

    function finalize(availableList, isLocked1, isLocked2) {
        if (!isLocked1) {
            currentSelection.team1 = availableList.splice(Math.floor(Math.random() * availableList.length), 1)[0];
            updateImage('img1', currentSelection.team1);
            document.getElementById('img1').classList.remove('spinning');
            renderChamps('team1Champs', document.getElementById('team1Label').innerText, currentSelection.team1);
        }
        if (!isLocked2) {
            currentSelection.team2 = availableList.splice(Math.floor(Math.random() * availableList.length), 1)[0];
            updateImage('img2', currentSelection.team2);
            document.getElementById('img2').classList.remove('spinning');
            renderChamps('team2Champs', document.getElementById('team2Label').innerText, currentSelection.team2);
        }
        document.getElementById('spinBtn').disabled = false;
    }

    function updateImage(imgId, regionName) {
        document.getElementById(imgId).src = regions[regionName].img;
    }

    function renderChamps(containerId, teamName, regionName) {
        const container = document.getElementById(containerId);
        const list = regions[regionName].champs;
        container.innerHTML = `
            <div style="color:var(--gold); font-weight:bold; border-bottom:1px solid #444; margin-bottom:12px; padding-bottom:5px;">${teamName} 챔피언 후보</div>
            <ul class="champ-list">
                ${list.map(c => `<li>${c}</li>`).join('')}
            </ul>
        `;
    }

    function saveAsImage() {
        const area = document.getElementById('capture-area');
        html2canvas(area, {
            backgroundColor: "#0a0a0c",
            useCORS: true, 
            scale: 2 
        }).then(canvas => {
            const link = document.createElement('a');
            link.download = `MEGA_Matchup_${new Date().getTime()}.png`;
            link.href = canvas.toDataURL();
            link.click();
        });
    }
</script>
</body>
</html>
